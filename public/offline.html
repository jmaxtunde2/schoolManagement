<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Hors ligne — CoriSchool</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
            color: #e2e8f0;
            text-align: center;
        }
        .card {
            max-width: 420px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 32px 28px;
            backdrop-filter: blur(8px);
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #10b981, #0d9488);
            font-weight: 800;
            font-size: 24px;
            color: #fff;
        }
        h1 { font-size: 20px; margin: 0 0 10px; }
        p { margin: 0 0 22px; color: #94a3b8; line-height: 1.6; font-size: 14px; }
        button {
            appearance: none;
            border: 0;
            cursor: pointer;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: #059669;
        }
        button:hover { background: #10b981; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">CS</div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            CoriSchool a besoin d'une connexion Internet pour afficher vos données
            à jour. Vérifiez votre réseau puis réessayez.
        </p>
        <button type="button" onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
